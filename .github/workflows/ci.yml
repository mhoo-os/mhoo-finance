name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run coverage
      - run: npm run check
      - run: npm run deploy:check
      - run: corepack enable
      - run: npm run finance:install
      - run: npm run finance:fixtures
      - run: npm run finance:test
      - run: npm run finance:lint
      - run: npm run finance:typecheck
      - run: npm run finance:standalone:typecheck
      - run: npm run finance:standalone:build
      - run: npx wrangler deploy --dry-run --config standalone/wrangler.jsonc --outdir dist/standalone-dry-run
